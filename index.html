<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>💖 Mehak · will you be my girlfriend?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #2b0b2b 0%, #1f0a1f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 16px;
            touch-action: manipulation;
            overflow: hidden;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 240, 245, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 64px 24px 64px 24px;
            padding: 28px 20px 40px;
            box-shadow: 0 30px 45px rgba(0,0,0,0.7), 0 0 0 2px rgba(255, 200, 220, 0.2);
            text-align: center;
            border: 1px solid rgba(255, 180, 200, 0.3);
            position: relative;
            z-index: 10;
        }
        .card h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffe6f0;
            text-shadow: 0 0 12px #ff4d7a, 0 0 30px #b3004b;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .card .sub {
            color: #ffbfd5;
            font-size: 1.1rem;
            margin-bottom: 24px;
            opacity: 0.9;
            border-bottom: 1px dashed #ff7fa3;
            padding-bottom: 12px;
        }
        .propose-box {
            background: rgba(20, 5, 20, 0.6);
            border-radius: 48px 16px 48px 16px;
            padding: 22px 16px 28px;
            backdrop-filter: blur(4px);
            border: 1px solid #ff99bb;
            box-shadow: inset 0 0 30px rgba(255, 80, 120, 0.2);
        }
        .propose-text {
            font-size: 1.7rem;
            font-weight: 600;
            color: #fff0f5;
            line-height: 1.3;
            margin-bottom: 20px;
            text-shadow: 0 0 8px #ff3366;
        }
        .propose-text small {
            display: block;
            font-size: 1rem;
            font-weight: 300;
            color: #ffb3c9;
            margin-top: 8px;
            text-shadow: none;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 20px 0 8px;
        }
        .btn {
            border: none;
            padding: 14px 40px;
            border-radius: 60px;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: #2a0f1f;
            color: #ffe6f0;
            box-shadow: 0 8px 0 #0d040d, 0 8px 20px rgba(255, 40, 80, 0.4);
            transition: all 0.07s ease;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 120px;
            border: 1px solid #ff99bb;
            text-shadow: 0 0 6px #ff4d7a;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0d040d;
        }
        .btn-yes {
            background: #b3004b;
            border-color: #ff6699;
            box-shadow: 0 8px 0 #6b002b, 0 8px 20px #ff3366;
        }
        .btn-yes:active {
            background: #d4005a;
        }
        .btn-no {
            background: #331122;
            border-color: #994466;
            box-shadow: 0 8px 0 #1a081a, 0 8px 20px #882244;
        }
        .btn-no:active {
            background: #4d1a33;
        }
        .heart-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        #heartCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .message-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 2, 10, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 28px 32px 36px;
            border-radius: 80px 20px 80px 20px;
            border: 2px solid #ff99bb;
            box-shadow: 0 30px 70px rgba(255, 0, 80, 0.7), 0 0 0 4px #ff3377;
            z-index: 1000;
            max-width: 380px;
            width: 90%;
            pointer-events: auto;
            text-align: center;
            transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            visibility: hidden;
        }
        .message-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .message-popup h2 {
            font-size: 2.2rem;
            color: #ffe6f0;
            text-shadow: 0 0 20px #ff3366;
            margin-bottom: 8px;
        }
        .message-popup p {
            font-size: 1.4rem;
            color: #ffbfd5;
        }
        .message-popup .big-heart {
            font-size: 4rem;
            line-height: 1.2;
            filter: drop-shadow(0 0 20px #ff4d7a);
        }
        .final-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a041a, #0a010a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1100;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: 0.5s ease;
        }
        .final-message.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .final-message h1 {
            font-size: 4rem;
            color: #ffb3d1;
            text-shadow: 0 0 30px #ff3377, 0 0 80px #cc0044;
            animation: pulseGlow 1.2s infinite alternate;
            text-align: center;
            padding: 20px;
            line-height: 1.3;
        }
        .final-message .sub-final {
            font-size: 2rem;
            color: #ff99bb;
            margin-top: 8px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #ff4d7a;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 20px #ff3377, 0 0 60px #cc0044; transform: scale(1); }
            100% { text-shadow: 0 0 50px #ff6699, 0 0 120px #ff0044; transform: scale(1.03); }
        }
        .float-word {
            position: absolute;
            font-weight: 700;
            color: #ffb3d1;
            text-shadow: 0 0 20px #ff4d7a, 0 0 60px #b3004b;
            white-space: nowrap;
            font-size: 2.8rem;
            opacity: 0.9;
            animation: floatUp 3s ease-in forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-30px) scale(1.1) rotate(5deg); }
            100% { transform: translateY(-400px) scale(1.6) rotate(15deg); opacity: 0; }
        }
        @media (max-width: 480px) {
            .card { padding: 20px 12px 30px; }
            .propose-text { font-size: 1.4rem; }
            .btn { font-size: 1.3rem; padding: 12px 20px; min-width: 100px; }
            .message-popup h2 { font-size: 1.8rem; }
            .final-message h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="card" id="proposalCard">
        <h1>💕 Mehak</h1>
        <div class="sub">✨ a little something for you ✨</div>
        <div class="propose-box">
            <div class="propose-text" id="questionText">
                I like you a lot ❤️<br>
                <small>will you be my girlfriend ?</small>
            </div>
            <div class="btn-group">
                <button class="btn btn-yes" id="yesBtn">YES</button>
                <button class="btn btn-no" id="noBtn">NO</button>
            </div>
            <div style="margin-top: 18px; font-size: 0.9rem; color: #ff99bb; opacity: 0.7;">tap the hearts · or the buttons</div>
        </div>
    </div>

    <!-- Heart Canvas -->
    <div class="heart-canvas-container" id="heartContainer">
        <canvas id="heartCanvas"></canvas>
    </div>

    <!-- Popup Message -->
    <div class="message-popup" id="messagePopup">
        <div class="big-heart">💖💗💖</div>
        <h2>I like you too!</h2>
        <p>💕 will you be mine? 💕</p>
        <div style="margin-top: 16px; display: flex; justify-content: center; gap: 20px;">
            <button class="btn btn-yes" style="padding: 10px 28px; font-size: 1.4rem;" id="popupYesBtn">YES</button>
            <button class="btn btn-no" style="padding: 10px 28px; font-size: 1.4rem;" id="popupNoBtn">NO</button>
        </div>
    </div>

    <!-- Final Screen -->
    <div class="final-message" id="finalMessage">
        <h1>❤️ I LOVE U ❤️</h1>
        <div class="sub-final">💖 MEHAK 💖</div>
        <div style="margin-top: 30px; font-size: 2.5rem; filter: drop-shadow(0 0 30px #ff3377);">💕✨💕</div>
        <div style="margin-top: 18px; color: #ffaacc; font-size: 1.3rem;">you made me the happiest ❤️</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            let hearts = [];
            let animationFrame;
            let heartInterval;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class HeartParticle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - 20;
                    this.size = Math.random() * 18 + 8;
                    this.speedY = Math.random() * 1.6 + 0.6;
                    this.speedX = (Math.random() - 0.5) * 1.2;
                    this.color = `hsl(${Math.random() * 60 + 330}, 90%, 65%)`;
                    this.opacity = Math.random() * 0.7 + 0.3;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                }
                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX + Math.sin(this.y * 0.01) * 0.2;
                    this.rotation += this.rotationSpeed;
                    if (this.y < -30) {
                        this.y = canvas.height + 20;
                        this.x = Math.random() * canvas.width;
                        this.size = Math.random() * 18 + 8;
                        this.color = `hsl(${Math.random() * 60 + 330}, 90%, 65%)`;
                    }
                    if (this.x < -20) this.x = canvas.width + 10;
                    if (this.x > canvas.width + 20) this.x = -10;
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.opacity;
                    ctx.font = `${this.size}px "Segoe UI", "Arial", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#ff4d7a';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = this.color;
                    ctx.fillText('♥', 0, 0);
                    ctx.restore();
                }
            }

            function initHearts(count = 70) {
                hearts = [];
                for (let i = 0; i < count; i++) {
                    hearts.push(new HeartParticle());
                }
            }
            initHearts(80);

            function animateHearts() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let h of hearts) {
                    h.update();
                    h.draw();
                }
                animationFrame = requestAnimationFrame(animateHearts);
            }

            function startHearts() {
                if (!animationFrame) {
                    animateHearts();
                }
                if (!heartInterval) {
                    heartInterval = setInterval(() => {
                        for (let i = 0; i < 6; i++) {
                            hearts.push(new HeartParticle());
                        }
                        if (hearts.length > 160) hearts.splice(0, 30);
                    }, 800);
                }
            }
            startHearts();

            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const popupYes = document.getElementById('popupYesBtn');
            const popupNo = document.getElementById('popupNoBtn');
            const popup = document.getElementById('messagePopup');
            const finalMsg = document.getElementById('finalMessage');
            const questionText = document.getElementById('questionText');

            function showPopup() {
                popup.classList.add('show');
                for (let i = 0; i < 20; i++) {
                    hearts.push(new HeartParticle());
                }
                if (hearts.length > 180) hearts.splice(0, 40);
            }

            function hidePopup() {
                popup.classList.remove('show');
            }

            function handleYes() {
                hidePopup();
                finalMsg.classList.add('show');
                spawnLoveWords();
                for (let i = 0; i < 40; i++) {
                    hearts.push(new HeartParticle());
                }
                questionText.innerHTML = `💖 I love you too, Mehak! 💖<small>you said YES 💕</small>`;
                yesBtn.disabled = true;
                noBtn.disabled = true;
                popupYes.disabled = true;
                popupNo.disabled = true;
            }

            function handleNo() {
                hidePopup();
                questionText.innerHTML = `😢 oh ... but I still like you 💔<small>tap the hearts again if you change your mind ✨</small>`;
                setTimeout(() => {
                    if (!finalMsg.classList.contains('show')) {
                        questionText.innerHTML = `I like you a lot ❤️<br><small>will you be my girlfriend ?</small>`;
                    }
                }, 4000);
            }

            function spawnLoveWords() {
                const container = document.body;
                const words = ['I love u', 'Mehak ❤️', '💖', '✨', 'Mehak', 'I love you', '💕', 'Mehak', '❤️', 'I love u', 'Mehak', '💗', '✨', 'Mehak', 'I love u'];
                for (let i = 0; i < 40; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.className = 'float-word';
                        const word = words[Math.floor(Math.random() * words.length)];
                        el.textContent = word;
                        el.style.left = Math.random() * 90 + 5 + '%';
                        el.style.top = Math.random() * 80 + 10 + '%';
                        el.style.fontSize = (Math.random() * 2.2 + 1.6) + 'rem';
                        el.style.color = `hsl(${Math.random() * 60 + 320}, 90%, 70%)`;
                        el.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                        container.appendChild(el);
                        setTimeout(() => el.remove(), 4000);
                    }, i * 100);
                }
            }

            yesBtn.addEventListener('click', (e) => {
                console.log('yesBtn clicked');
                e.preventDefault();
                showPopup();
                document.querySelector('.message-popup h2').textContent = '💕 I like you too!';
                document.querySelector('.message-popup p').textContent = 'will you be my girlfriend?';
            });

            noBtn.addEventListener('click', (e) => {
                e.preventDefault();
                showPopup();
                document.querySelector('.message-popup h2').textContent = '😅 really?';
                document.querySelector('.message-popup p').textContent = 'think again ... ❤️';
            });

            popupYes.addEventListener('click', (e) => {
                console.log('popupYes clicked');
                e.preventDefault();
                handleYes();
            });

            popupNo.addEventListener('click', (e) => {
                e.preventDefault();
                handleNo();
                setTimeout(() => hidePopup(), 300);
            });

            document.addEventListener('click', function(e) {
                if (!popup.classList.contains('show') && !finalMsg.classList.contains('show')) {
                    for (let i = 0; i < 10; i++) {
                        hearts.push(new HeartParticle());
                    }
                }
            });

            finalMsg.addEventListener('click', function() {
                spawnLoveWords();
                for (let i = 0; i < 20; i++) hearts.push(new HeartParticle());
            });

            // removed touchstart preventDefault to allow click events on mobile

            setTimeout(() => {
                for (let i = 0; i < 15; i++) hearts.push(new HeartParticle());
            }, 300);

            console.log('💖 Mehak, I love you! 💖');
        });
    </script>
</body>
</html>
